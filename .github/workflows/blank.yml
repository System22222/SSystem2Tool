name: Build SSystem2Tool
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyside6 pyinstaller certifi
      - run: python -m PyInstaller --noconsole --onefile --collect-data certifi --name System2Tool --icon icon.ico --add-data "fondo.jpg;." --add-data "eiffel.jpg;." --add-data "azul.jpg;." --add-data "icon.ico;." system2tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: System2Tool
          path: dist/System2Tool.exe
